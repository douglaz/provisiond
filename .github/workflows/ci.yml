name: gates

# The reference implementation this set was extracted from shipped with a CI job
# that ran a test suite containing zero tests, and a green check next to it
# (DEF-16). A green check that asserts nothing is worse than no check, so this
# workflow runs gates that can actually fail, and 10-conformance-checklist.md
# opens by saying to treat any unchecked box as that same green check.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: specification gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The formal layer (ADR-0025) needs Lean; flake.nix is the one place the
      # toolchain is pinned, so CI enters the same shell a developer does.
      - uses: cachix/install-nix-action@v31

      - name: Run all gates
        run: nix develop --command bash tools/check-all.sh

      # Proving the gates can fail is the point of CNF-3 ("The test suite fails
      # when a test is deliberately broken -- verified once, by hand, so that
      # 'tests passed' means something"). This does it on every run, against a
      # scratch copy, so the green check above is evidence rather than decoration.
      - name: Prove the identifier gate can fail
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n**API-9999** A citation to `DOM-9999`, which does not exist.\n' >> 00-overview.md
          if python3 tools/check_ids.py; then
            echo "::error::identifier gate passed a document with a dangling citation"
            exit 1
          fi
          echo "identifier gate correctly rejected a dangling citation"

      # The same gate refuses a conformance item that carries a launch tier; the
      # tiers were withdrawn on 2026-09-12 (F50) and every item gates. The control
      # re-tags one existing item rather than appending a `CNF-9999` line: 9999 is
      # an outlier id and would be refused for that reason whether or not the tier
      # check existed, which is a control that cannot fail for the reason it tests.
      - name: Prove the identifier gate refuses a tiered conformance item
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          sed -i 's/^- \[ \] \*\*CNF-1\*\* — /- [ ] **CNF-1** **BLOCKING** — /' \
            10-conformance-checklist.md
          if python3 tools/check_ids.py; then
            echo "::error::identifier gate passed a conformance item carrying a tier"
            exit 1
          fi
          echo "identifier gate correctly rejected a tiered conformance item"

      # The obligation gate has a real historical positive -- the 2026-09-02 fence
      # bug, where OPS-42 stated LDG-62's half of a contention that LDG-62 never
      # mentioned -- but `--selftest` reads that commit from history, and a shallow
      # CI checkout does not have it. So prove it synthetically here, and keep
      # `--selftest` for local runs in a full clone.
      - name: Prove the obligation gate can fail
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n**OVR-9998** The store `DOM-1` MUST record `a_column_dom1_never_mentions`.\n' \
            >> 00-overview.md
          if python3 tools/check_obligations.py; then
            echo "::error::obligation gate passed a duty its target never mentions"
            exit 1
          fi
          echo "obligation gate correctly rejected an orphaned obligation"

      # The citation gate's known-positive is the WIR-1 miscitation that lived in
      # 13-wire-contract.md until 2026-09-03; `--selftest` reads it from history
      # and a shallow CI checkout does not have it. Prove it synthetically here.
      - name: Prove the citation gate can fail
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          printf '\n`OVR-1` says "a phrase OVR-1 has never contained anywhere".\n' \
            >> 00-overview.md
          if python3 tools/check_citations.py; then
            echo "::error::citation gate passed a quote its target does not contain"
            exit 1
          fi
          echo "citation gate correctly rejected an unverifiable quoted attribution"

      # The formal layer's controls (ADR-0025). Each breaks the specific thing its
      # check guards, and each asserts the failure came from that check and not
      # from a syntax error or a missing toolchain -- a red build for the wrong
      # reason is not evidence the gate works. The first is the predicate swap the
      # Python arithmetic gate carried until 2026-09-13: its first draft derived
      # both sides of the comparison from one variable and was a tautology that
      # could never fail, which is why a control exists for this at all.
      - name: Prove the Lean build rejects the withdrawn OPS-41 predicate
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^def abortDate (reserved prot rate : Nat) : Bool := runwaySeconds reserved prot rate > 0$/def abortDate (reserved prot _rate : Nat) : Bool := usableSats reserved prot > 0/' \
            Provisiond/Runway.lean
          grep -q 'def abortDate (reserved prot _rate : Nat) : Bool := usableSats' Provisiond/Runway.lean
          if nix develop --command lake build > build.log 2>&1; then
            echo "::error::lake build passed with the withdrawn predicate in abortDate"
            exit 1
          fi
          # Lean names the line, not the theorem: the unsolved goal is in Runway.lean,
          # and nothing else in that file can fail on this mutation.
          grep -q 'error: Provisiond/Runway.lean:.*unsolved goals' build.log
          echo "lake build correctly failed on abortDate_never_on_routed"

      - name: Prove the axiom gate rejects a sorry the build accepts
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^    grind$/    sorry/' Provisiond/Meter.lean
          grep -q '^    sorry$' Provisiond/Meter.lean
          nix develop --command lake build
          if nix develop --command lake exe gate > index.jsonl 2> gate.err; then
            echo "::error::axiom gate passed a proof that uses sorry"
            exit 1
          fi
          grep -q 'sorryAx' gate.err
          echo "axiom gate correctly rejected sorryAx while lake build stayed green"

      - name: Prove the axiom gate rejects native_decide outside Provisiond.Explore
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          cat >> Provisiond/Witnesses.lean <<'EOF'

          namespace Provisiond.Explore
          theorem allowed_here : Provisiond.Meter.postedDebit (2/5) 0 = 1 := by native_decide
          end Provisiond.Explore
          namespace Provisiond.Witnesses
          theorem not_allowed_here : Provisiond.Meter.postedDebit (2/5) 0 = 1 := by native_decide
          end Provisiond.Witnesses
          EOF
          nix develop --command lake build
          if nix develop --command lake exe gate > index.jsonl 2> gate.err; then
            echo "::error::axiom gate passed native_decide outside Provisiond.Explore"
            exit 1
          fi
          grep -q 'not_allowed_here uses native_decide' gate.err
          # Every refusal line must be about not_allowed_here (its minted axiom carries the
          # same name); a line about Explore.allowed_here would mean the exemption is broken.
          if grep 'uses native_decide' gate.err | grep -v not_allowed_here | grep -q .; then
            echo "::error::axiom gate refused native_decide inside Provisiond.Explore"
            exit 1
          fi
          echo "axiom gate correctly refused native_decide outside Explore and allowed it inside"

      - name: Prove the formal gate rejects a module the build never reads
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          sed -i '/^import Provisiond.Witnesses$/d' tools/formal/Provisiond.lean
          if nix develop --command bash tools/check_formal.sh > formal.log 2>&1; then
            echo "::error::formal gate passed with Witnesses.lean unimported"
            exit 1
          fi
          grep -q 'does not import Provisiond.Witnesses' formal.log
          echo "formal gate correctly rejected the orphaned module"

      # The claim model's guard terms are parameters (ADR-0025): dropping ADR-0022's
      # claim term is a one-token change to `Provisiond.Claim.current`, and the
      # stale-defer witness must go red on exactly that. Claim.lean's own theorems
      # take the term as a hypothesis, so the module stays green and Witnesses.lean
      # is built; the red must come from the refused witness and nowhere else.
      - name: Prove the Lean build rejects the claim guard without its claim term
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^def current : Guards := { claimTerm := true, repeatBranch := true }$/def current : Guards := { claimTerm := false, repeatBranch := true }/' \
            Provisiond/Claim.lean
          grep -q 'claimTerm := false, repeatBranch := true' Provisiond/Claim.lean
          if nix develop --command lake build > build.log 2>&1; then
            echo "::error::lake build passed with the claim term removed from the guard"
            exit 1
          fi
          # One red, and it is `decide` refuting the refused witness's own proposition:
          # a second error line would mean the mutation broke something other than
          # the property it targets.
          test "$(grep -c '^error: Provisiond/' build.log)" -eq 1
          grep -q 'error: Provisiond/Witnesses.lean:.*decide. proved that the proposition' build.log
          grep -A1 'proved that the proposition' build.log | grep -q 'staleDeferTrace current ='
          echo "lake build correctly failed on stale_defer_refused"

      # The closed tables (pv-vwe.2): a kind added to DOM-17 without a row is a red
      # build, because every match over ErrorKind carries no wildcard and the
      # enumeration's completeness theorem is by `cases`. The red must be Tables.lean's
      # own: a missing case, not a syntax error elsewhere.
      - name: Prove the Lean build rejects an error kind without a classification row
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^  | insufficientBalance | notActivated | halted | gone | suspended | ceilingExceeded | overloaded$/&\n  | unclassifiedKind/' \
            Provisiond/Tables.lean
          grep -q '^  | unclassifiedKind$' Provisiond/Tables.lean
          if nix develop --command lake build > build.log 2>&1; then
            echo "::error::lake build passed with an error kind no table row classifies"
            exit 1
          fi
          grep -q 'error: Provisiond/Tables.lean:.*[Mm]issing cases' build.log
          if grep '^error: Provisiond/' build.log | grep -v 'Provisiond/Tables.lean' | grep -q .; then
            echo "::error::the mutation broke something outside Tables.lean"
            exit 1
          fi
          echo "lake build correctly failed on the wildcard-free matches over ErrorKind"

      # OPS-11's goal-state row is a parameter (ADR-0025): dropping it is a one-token
      # change to `Provisiond.Tables.currentRules`, and the already-deleted witness must
      # go red on exactly that, with Tables.lean's own theorems staying green.
      - name: Prove the Lean build rejects the classification without its goal-state row
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          sed -i 's/^def currentRules : Rules := { goalStateRow := true, markerRule := true }$/def currentRules : Rules := { goalStateRow := false, markerRule := true }/' \
            Provisiond/Tables.lean
          grep -q 'goalStateRow := false, markerRule := true' Provisiond/Tables.lean
          if nix develop --command lake build > build.log 2>&1; then
            echo "::error::lake build passed with the goal-state row removed from the classification"
            exit 1
          fi
          test "$(grep -c '^error: Provisiond/' build.log)" -eq 1
          grep -q 'error: Provisiond/Witnesses.lean:.*decide. proved that the proposition' build.log
          grep -A6 'proved that the proposition' build.log | grep -q 'deleteMachine'
          echo "lake build correctly failed on already_deleted_witness"

      # The migration-plan type (STO-12): a CONCURRENTLY build inside a transactional
      # migration is not a value of the type. The control writes one, in the Explore
      # namespace so nothing tagged is touched, and requires the type to refuse it.
      - name: Prove the migration type refuses a CONCURRENTLY build inside a transaction
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo/tools/formal"
          cat >> Provisiond/Witnesses.lean <<'EOF2'

          namespace Provisiond.Explore
          def concurrent_inside_a_transaction :
              Provisiond.Migration.Migration Provisiond.Migration.postgres true :=
            .transactional [.createIndex true true] (by decide)
          end Provisiond.Explore
          EOF2
          if nix develop --command lake build > build.log 2>&1; then
            echo "::error::lake build accepted a CONCURRENTLY build inside a transactional migration"
            exit 1
          fi
          test "$(grep -c '^error: Provisiond/' build.log)" -eq 1
          grep -q 'error: Provisiond/Witnesses.lean:.*decide. proved that the proposition' build.log
          grep -A6 'proved that the proposition' build.log | grep -q 'postgres'
          echo "the migration type correctly refused the transactional CONCURRENTLY build"

      # The cancellation fence (pv-vwe.4, completed by pv-vwe.10): every guard OPS-41 and
      # OPS-42 gained by dated amendment between 2026-09-02 and 2026-09-09 is a field of
      # `Provisiond.Fence.current`, one per line. Each row below flips one field and requires
      # exactly one red: `decide` refuting the witness that field's amendment exists for,
      # identified by a token of its proposition. Fence.lean's own theorems take each guard as
      # a hypothesis and stay green, and every witness asserts only what its own parameter
      # decides, so no neighbouring witness fails for want of the flipped one. The rows:
      #   recheckInsideFence (2026-09-02): the extension commits in the gap, the paid machine
      #     is deleted -- fence_first_witness on paidMachineTrace;
      #   fenceHolds (2026-09-08): the retry's write affects no row -- retry_executes_witness;
      #   fenceOnOpenEpisode (2026-09-09): a fence set under a closed episode clears never --
      #     gone_write_witness on goneRaceTrace;
      #   abortPredicate (2026-09-04): usable_sats > 0 aborts a routed machine forever --
      #     withdrawn_predicate_loops_in_lifecycle;
      #   abortWritesDate (2026-09-05): the abort leaves the stored date in the past --
      #     abort_without_date_write_reroutes on staleDateWorld;
      #   extendWritesDate (2026-09-05): the extension leaves it there --
      #     successful_extension_witness on [.extend 100];
      #   suspensionKey (2026-09-05): a resumed tenant's paid machine is destroyed --
      #     suspension_keyed_on_current_state_witness on resumedTenantTrace;
      #   outageWrite (2026-09-05): a stale no-rate read destroys a funded fleet --
      #     no_rate_cancellation_witness on restoredRateTrace;
      #   ownIdClause (2026-09-02): "IS NULL alone" refuses the retry -- retry_executes_witness;
      #   noRateHoldsExhausted (2026-09-05): the sweep routes on an aged column with no rate --
      #     exhausted_since_routing_witness;
      #   retryGuard (2026-09-09): a plain retry write reopens a closed episode --
      #     retry_guard_witness.
      # The restore (pv-vwe.11, ADR-0023), Restore.current, the same shape:
      #   quarantineOnRestore (OPS-15, 2026-09-12): the executed create is claimed again --
      #     executed_create_quarantined on [.lock, .startupPass, .claim ⟨0⟩];
      #   exceptionFrozen (OPS-15, 2026-09-12): the parent is queued and claimed unconfirmed --
      #     parent_waits_witness, on the claim after confirmParents;
      #   bumpOnRestore (STO-54, 2026-09-12): the revoked generation 0 is served --
      #     resurrected_token_refused on [.., .request 0, .completeProcedure, ..];
      #   twoPassAbsence (STO-54, 2026-09-12): the first complete pass records the absence --
      #     absence_on_second_pass_only on the two sweeps before the window.
      # Reconciliation knowledge (pv-vwe.5), Reconcile.current, the same shape:
      #   completePassOnly (OPS-32, 2026-09-02): the interrupted pass rereads into the throttle,
      #     the 2026-08-31 "yield to rate_limited" sentence, since PRV-36 leaves this guard no
      #     live meter to stop (Reconcile.lean's docstring) --
      #     interrupted_pass_witness, w.retriedIntoThrottle = false;
      #   pastWindowOnly (OPS-32, 2026-09-04): a reread inside the listing lag stops a live meter --
      #     inside_window_records_nothing on [.advance 7, ..];
      #   rereadBeforeAbsence (OPS-32, 2026-09-04): the listing alone stops a live meter --
      #     unlisted_live_machine_reread on [.advance 2000, .sweep true false .found];
      #   absenceWindow (OPS-32, 2026-09-04): the gone machine bills until the negative window --
      #     absence_on_visibility_window on [.advance 20, ..];
      #   readConfirmsMatch (OPS-27, 2026-09-05): the match attaches a gone machine --
      #     match_is_not_observation, w.orderLanded = some mach.
      # Funding and the tenant lifecycle (pv-vwe.6), Ledger.current and Funding.current:
      #   clampAtAuthority (LDG-31's clamp paragraph): the excess is taken from available
      #     balance, the seizure -- clamp_witness on seizureBalances;
      #   serializedAuthorization (LDG-35, the primitive of ADR-0015, 2026-09-06): two opens
      #     commit against one read -- serialized_authorization_witness on skewTrace;
      #   keyFrom := .observation (LDG-8): with the payments row pinned off, the replayed
      #     settlement credits twice -- replay_credits_once_by_key on replayTrace;
      #   keyFrom := .deposit (STO-31): the second rail's payment is suppressed --
      #     second_rail_credited on bothRailsTrace;
      #   paymentRecordUnique (STO-46, 2026-09-02): with the key pinned to the observation, the
      #     replay and the post-attribution re-scan credit again --
      #     replay_refused_by_record, keyFrom := KeySource.observation;
      #   correctionPrefix (WIR-42, 2026-09-05): the correction collides with the source
      #     tenant's topup and nothing moves -- attribution_witness on attributionTrace;
      #   reapWaitsForWindow (API-34): a tenant with a deposit inside its window is reaped and
      #     the payment lands unattributed -- reap_waits_for_window_witness on reapTrace.
      # Wire canonicalization and redaction (pv-vwe.3), Wire.current:
      #   endpointInPreimage (WIR-3, "Method and target are part of the fingerprint"): the delete
      #     on machine B replays the delete on A -- endpoint_in_fingerprint_witness on deleteOnA;
      #   closedSummary (STO-50, 2026-09-06): the live row's payload sits in the summary that
      #     outlives the purge -- closed_summary_witness on secretRow.
      # Rescue and install (pv-vwe.7), Rescue.current:
      #   coalesceWrite (OPS-45, 2026-09-12, ADR-0022): the null-guarded repeat after a lost reply
      #     affects no row, reads as overtaken, and the phase never runs --
      #     coalesced_repeat_moves_nothing on rawInstall lostReplyThenRepeat;
      #   markerBeforePhase (OPS-45, reworded 2026-09-15): the marker written after the phase is
      #     unset over a disk a dying process wrote, and the projection says untouched --
      #     phase_refused_before_the_marker on rawInstall phaseWithoutMarker;
      #   secondMarkerBeforeSession (OPS-45, 2026-09-16): a crash mid-session leaves null and
      #     OPS-15's pass cannot render rescue_exit: "unknown" (RSC-19) --
      #     crash_renders_rescue_exit_unknown on rescueSession crashedSession;
      #   partialCleanupMovesNothing (OPS-45, PRV-18): the driver's cleanup report closes a
      #     session the engine never opened, and the machine reads clean --
      #     partial_cleanup_moves_nothing on rescueInstall partialActivation;
      #   persistAtActivation := true (RSC-19, the design its 2026-09-15 paragraph refuses): a
      #     clean successful install has a root credential on disk for the whole session --
      #     clean_exit_leaves_no_key on rescueSession cleanSession.
      # The loop reads its rows from stdin, so the build runs with stdin closed and the step
      # counts the rows it passed: a child that swallowed the rest of the list would otherwise
      # exit green having tested one. `set -uo` without `-e`: each row records its own verdict.
      - name: Prove the Lean build rejects each fence, restore, reconciliation, funding, wire and rescue guard's removal, one witness each
        run: |
          set -uo pipefail
          fail=0
          passed=0
          while IFS='|' read -r file field from to token; do
            tmp="$(mktemp -d)"
            cp -r . "$tmp/repo"
            pushd "$tmp/repo/tools/formal" > /dev/null
            # One field per line; the last closes the brace instead of taking a comma.
            sed -i "s/^    ${field} *:= ${from}\(,\| }\)\$/    ${field} := ${to}\1/" "Provisiond/${file}.lean"
            if ! grep -q "^    ${field} := ${to}\(,\| }\)\$" "Provisiond/${file}.lean"; then
              echo "::error::${field}: the mutation did not apply"; fail=1
            elif nix develop --command lake build < /dev/null > build.log 2>&1; then
              echo "::error::lake build passed with ${field} := ${to}"; fail=1
            elif [ "$(grep -c '^error: Provisiond/' build.log)" -ne 1 ]; then
              echo "::error::${field}: more than one red"; grep '^error: Provisiond/' build.log; fail=1
            elif ! grep -q 'error: Provisiond/Witnesses.lean:.*decide. proved that the proposition' build.log; then
              echo "::error::${field}: the red is not a refuted witness"; grep '^error' build.log; fail=1
            elif ! grep -A6 'proved that the proposition' build.log | grep -q "$token"; then
              echo "::error::${field}: the red witness is not the targeted one ($token)"
              grep -A6 'proved that the proposition' build.log; fail=1
            else
              echo "lake build correctly failed on ${field} := ${to}, on the witness naming $token"
              passed=$((passed + 1))
            fi
            popd > /dev/null
            rm -rf "$tmp"
          done <<'ROWS'
          Fence|recheckInsideFence|true|false|fenceWorld paidMachineTrace
          Fence|fenceHolds|.episodeId|.attemptId|fenceWorld retryTrace
          Fence|fenceOnOpenEpisode|true|false|goneRaceTrace
          Fence|abortPredicate|.date|.sats|AbortPredicate.sats
          Fence|abortWritesDate|true|false|staleDateWorld abortTrace
          Fence|extendWritesDate|true|false|Event.extend 100
          Fence|suspensionKey|.currentState|.episodeReasons|resumedTenantTrace
          Fence|outageWrite|true|false|restoredRateTrace
          Fence|ownIdClause|true|false|fenceWorld retryTrace
          Fence|noRateHoldsExhausted|true|false|now := 100
          Fence|retryGuard|true|false|goneAfterStallTrace ++
          Restore|quarantineOnRestore|true|false|Event.startupPass, Event.claim { n := 0 }
          Restore|exceptionFrozen|true|false|Event.confirmParents, Event.claim { n := 1 }
          Restore|bumpOnRestore|true|false|Event.request 0, Event.completeProcedure
          Restore|twoPassAbsence|true|false|Event.sweep true false, Event.windowElapses
          Reconcile|completePassOnly|true|false|w.retriedIntoThrottle = false
          Reconcile|pastWindowOnly|true|false|Event.advance 7, Event.sweep true false Answer.notFound
          Reconcile|rereadBeforeAbsence|true|false|Event.advance 2000, Event.sweep true false Answer.found
          Reconcile|absenceWindow|.visibility|.negative|Event.advance 20, Event.sweep true false Answer.notFound
          Reconcile|readConfirmsMatch|true|false|w.orderLanded = some mach
          Ledger|clampAtAuthority|true|false|seizureBalances
          Ledger|serializedAuthorization|true|false|skewTrace
          Funding|keyFrom|.payment|.observation|replayTrace
          Funding|keyFrom|.payment|.deposit|bothRailsTrace
          Funding|paymentRecordUnique|true|false|KeySource.observation
          Funding|correctionPrefix|true|false|attributionTrace
          Funding|reapWaitsForWindow|true|false|reapTrace
          Wire|endpointInPreimage|true|false|deleteOnA
          Wire|closedSummary|true|false|secretRow
          Rescue|coalesceWrite|true|false|rawInstall lostReplyThenRepeat
          Rescue|markerBeforePhase|true|false|rawInstall phaseWithoutMarker
          Rescue|secondMarkerBeforeSession|true|false|Rescue.current rescueSession crashedSession
          Rescue|partialCleanupMovesNothing|true|false|Rescue.current rescueInstall partialActivation
          Rescue|persistAtActivation|false|true|Rescue.current rescueSession cleanSession
          ROWS
          if [ "$passed" -ne 34 ]; then
            echo "::error::expected 34 fence, restore, reconciliation, funding, wire and rescue controls to pass, got $passed"; fail=1
          fi
          exit "$fail"

      # The rendering gate (pv-vwe.8, ADR-0025): a hand edit inside a marked region is
      # red for that region, and the same edit one line outside it is not. The scratch
      # copy carries tools/formal/.lake from the "Run all gates" step above, which is
      # what the gate reads; a missing index would be exit 2, not the red we assert.
      - name: Prove the rendering gate rejects a hand edit inside a rendered region
        run: |
          set -euo pipefail
          src="$PWD"
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          sed -i 's/^| machine deleted, commitment closed | 71,900 | 0 | 71,900 |$/| machine deleted, commitment closed | 71,900 | 0 | 71,901 |/' \
            12-billing-and-ledger.md
          grep -q '| 0 | 71,901 |' 12-billing-and-ledger.md
          if python3 tools/check_regions.py > regions.log 2>&1; then
            echo "::error::rendering gate passed a hand-edited worked table"
            exit 1
          fi
          grep -q 'Provisiond.Render.ldg31Table drifted' regions.log
          test "$(grep -c ' drifted\| declaration says' regions.log)" -eq 1
          cd "$src" && rm -rf "$tmp/repo" && cp -r . "$tmp/repo" && cd "$tmp/repo"
          printf '\n\n**LDG-9999** is a sentence outside every marked region.\n' >> 12-billing-and-ledger.md
          python3 tools/check_regions.py
          echo "rendering gate correctly rejected the edit inside the region and passed the one outside"

      # A `match` region is diffed on its outcome tokens: flipping one row's fence verdict
      # is red for that row and column, while the prose beside it is free.
      - name: Prove the rendering gate rejects a flipped outcome in a diffed table
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          sed -i 's/^| Resolved `abandoned` — nobody established what happened | `closed`, `close_reason: abandoned`, in the resolution transaction | \*\*Cleared\*\*, same transaction/| Resolved `abandoned` — nobody established what happened | `closed`, `close_reason: abandoned`, in the resolution transaction | **Stays set**, same transaction/' \
            03-operation-lifecycle.md
          grep -q 'in the resolution transaction | \*\*Stays set\*\*, same transaction' 03-operation-lifecycle.md
          if python3 tools/check_regions.py > regions.log 2>&1; then
            echo "::error::rendering gate passed a table row whose fence verdict contradicts its declaration"
            exit 1
          fi
          grep -q 'Provisiond.Render.ops48Table: row 10, column 3' regions.log
          test "$(grep -c ' drifted\| declaration says' regions.log)" -eq 1
          echo "rendering gate correctly rejected the flipped fence verdict"

      # The name resolver: a declaration renamed under a document that cites it is a
      # dangling citation, and the citations gate is where it goes red.
      - name: Prove the citation gate rejects a declaration name the index does not carry
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r . "$tmp/repo"
          cd "$tmp/repo"
          sed -i 's/`Provisiond.Witnesses.period_reset_witness`/`Provisiond.Witnesses.period_reset_witnes`/' \
            11-open-findings.md
          grep -q 'period_reset_witnes`' 11-open-findings.md
          if python3 tools/check_citations.py > citations.log 2>&1; then
            echo "::error::citation gate passed a Provisiond.* name the index does not carry"
            exit 1
          fi
          grep -q 'cites `Provisiond.Witnesses.period_reset_witnes`, which the index does not carry' citations.log
          echo "citation gate correctly rejected the dangling declaration name"
